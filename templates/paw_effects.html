<script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.anime) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var em = ['🐾', '🐱', '⭐', '✨'];
            function pawBurst(x, y) {
                for (var i = 0; i < 7; i++) (function (i) {
                    var p = document.createElement('span');
                    p.className = 'paw-confetti';
                    p.textContent = em[i % em.length];
                    p.style.left = x + 'px'; p.style.top = y + 'px';
                    document.body.appendChild(p);
                    anime({ targets: p, translateX: [0, (Math.random() - 0.5) * 160], translateY: [0, -(Math.random() * 110 + 40)], rotate: [0, Math.random() * 360 - 180], opacity: [1, 0], duration: 800 + Math.random() * 500, easing: 'easeOutQuad', complete: function () { p.remove(); } });
                })(i);
            }
            document.querySelectorAll('.submit-btn, .cta-btn, a[href="/"]').forEach(function (el) {
                el.addEventListener('click', function (ev) { pawBurst(ev.clientX, ev.clientY); });
            });
            var driftEm = ['🐾', '🐱', '⭐', '✨'];
            function spawnDrift() {
                var p = document.createElement('span');
                p.className = 'paw-drift';
                p.textContent = driftEm[Math.floor(Math.random() * driftEm.length)];
                p.style.left = (Math.random() * 90 + 4) + '%';
                p.style.animationDuration = (Math.random() * 5 + 7) + 's';
                document.body.appendChild(p);
                setTimeout(function () { p.remove(); }, 13000);
            }
            spawnDrift(); spawnDrift();
            setInterval(spawnDrift, 2800);
            // Cute paw prints stream along the cursor (throttled)
            var lastPaw = 0;
            document.addEventListener('mousemove', function (e) {
                var n = Date.now(); if (n - lastPaw < 220) return; lastPaw = n;
                var p = document.createElement('span');
                p.className = 'paw-cursor'; p.textContent = '🐾';
                p.style.left = (e.clientX - 14) + 'px'; p.style.top = (e.clientY - 14) + 'px';
                document.body.appendChild(p);
                anime({ targets: p, translateY: [-14, 0], opacity: [0.8, 0], scale: [0.6, 1.1], duration: 650, easing: 'easeOutQuad', complete: function () { p.remove(); } });
            });
        });
    </script>
