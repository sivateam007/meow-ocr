<!-- ===== Meow Assistant chat widget (Groq AI — key stays server-side) ===== -->
<link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
<div id="meow-chat">
    <button type="button" id="meow-chat-toggle" aria-label="Chat with Meow Assistant" title="Ask Meow Assistant">
        <span class="meow-chat-toggle-img" style="background-image:url('{{ url_for('static', filename='images/pix-cat-1.jpg') }}')"></span>
        <span class="meow-chat-toggle-dot" aria-hidden="true"></span>
    </button>
    <div id="meow-chat-panel" class="meow-chat-panel" role="dialog" aria-label="Meow Assistant chat">
        <div class="meow-chat-header">
            <span class="meow-chat-avatar" style="background-image:url('{{ url_for('static', filename='images/pix-cat-1.jpg') }}')" role="img" aria-label="Whiskers the Cute"></span>
            <div class="meow-chat-heading">
                <div class="meow-chat-title">Meow Assistant</div>
                <div class="meow-chat-status"><span class="meow-chat-dot"></span> Whiskers the Cute — free &amp; online</div>
            </div>
            <button type="button" id="meow-chat-close" aria-label="Close chat"><i class="fas fa-times"></i></button>
        </div>
        <div class="meow-chat-body" id="meow-chat-body">
            <div class="meow-row row-bot">
                <span class="meow-avatar"><img src="{{ url_for('static', filename='images/pix-cat-1.jpg') }}" alt="Whiskers the Cute" loading="lazy"></span>
                <div class="meow-msg meow-msg-bot">Hi! I'm Whiskers the Cute 🐱 your free OCR helper. Tap a quick question below or ask me anything!</div>
            </div>
        </div>
        <div class="meow-chat-chips" id="meow-chat-chips">
            <button type="button" class="meow-chip" data-q="What features do you have?">Features</button>
            <button type="button" class="meow-chip" data-q="How do I use Meow OCR?">How to use</button>
            <button type="button" class="meow-chip" data-q="Is Meow OCR free?">Is it free?</button>
            <button type="button" class="meow-chip" data-q="Which languages are supported?">Languages</button>
            <button type="button" class="meow-chip" data-q="Are my files private?">Privacy</button>
            <button type="button" class="meow-chip" data-q="Can you read handwritten notes?">Handwritten</button>
            <button type="button" class="meow-chip" data-q="Can you turn text into audio?">Text to Audio</button>
            <button type="button" class="meow-chip" data-q="Who built Meow OCR?">About</button>
        </div>
        <form class="meow-chat-form" id="meow-chat-form">
            <input type="text" id="meow-chat-input" placeholder="Type a message…" autocomplete="off" maxlength="500" aria-label="Message Meow Assistant">
            <button type="submit" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>
<script>window.MEOW_AVATAR = "{{ url_for('static', filename='images/pix-cat-1.jpg') }}";</script>
<script src="{{ url_for('static', filename='chatbot.js') }}"></script>
